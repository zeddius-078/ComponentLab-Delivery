  <path class="edge-soft" d="M320 370 V575 H94 V810 H330 V835"/>
  <path class="edge" d="M850 370 V609 H330 V635"/>
  <path class="edge" d="M1370 370 V619 H825 V635"/>
  <path class="edge" d="M1510 370 H1590 V1030 H1020 V1085"/>
  <path class="edge" d="M2110 370 H2560 V1130 H2475"/>

  <!-- Internal component production. -->
