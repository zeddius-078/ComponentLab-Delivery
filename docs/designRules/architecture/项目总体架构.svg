<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1740" viewBox="0 0 2600 1740" role="img" aria-labelledby="title desc">
  <title id="title">三项目总体架构 / Three-project architecture</title>
  <desc id="desc">Figma、Pixso 和 Qt 能力进入 GenerateComponent；其 SDK 分别供 ComponentLab 与 GenerateLayout 使用，正式页面与 SDK 由业务 Qt 工程消费。虚线表示审核与反馈。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5.5 L1 10" fill="none" stroke="#315b98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-muted" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5.5 L1 10" fill="none" stroke="#7891af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#020916" flood-opacity=".22"/></filter>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Arial,sans-serif;letter-spacing:0}
      .title{font-size:53px;font-weight:700;fill:#f5f8ff}
      .subtitle{font-size:24px;fill:#aebfda}
      .legend{font-size:20px;fill:#d1ddef}
      .section{font-size:31px;font-weight:700;fill:#183965}
      .section-en{font-size:21px;fill:#58749b}
      .node-title{font-size:27px;font-weight:700;fill:#17375e}
      .node-en{font-size:20px;fill:#56739b}
      .path{font-family:Consolas,"Microsoft YaHei",monospace;font-size:19px;fill:#30527e}
      .small{font-size:18px;fill:#7089aa}
      .badge{font-family:"Segoe UI",Arial,sans-serif;font-size:23px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .panel{fill:#fdfefe;stroke:#799ad1;stroke-width:2.5;rx:8;filter:url(#shadow)}
      .panel-top{fill:#eaf1fc}
      .card{fill:#fff;stroke:#aabedb;stroke-width:2;rx:7}
      .card-dashed{fill:#fff;stroke:#9bb5dc;stroke-width:2;stroke-dasharray:7 6;rx:7}
      .edge{fill:none;stroke:#315b98;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .edge-soft{fill:none;stroke:#7891af;stroke-width:2.5;stroke-dasharray:10 9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-muted)}
      .edge-label{font-size:19px;fill:#315b98;font-weight:600}
    </style>
  </defs>

  <rect width="2600" height="1740" fill="#0e1727"/>
  <path d="M0 188 H2600" stroke="#385078" stroke-width="2"/>
  <text class="title" x="70" y="86">设计到 Qt：三项目总体架构</text>
  <text class="subtitle" x="72" y="139">DESIGN TO QT  ·  THREE-PROJECT ARCHITECTURE</text>
  <path d="M1880 86 H1950" class="edge"/>
  <text class="legend" x="1970" y="93">数据 / 依赖  Data / dependency</text>
  <path d="M1880 132 H1950" class="edge-soft"/>
  <text class="legend" x="1970" y="139">审核 / 反馈  Review / feedback</text>

  <!-- Four explicit upstream inputs. -->
  <g filter="url(#shadow)">
    <rect class="card" x="70" y="215" width="500" height="155"/>
    <rect class="card" x="600" y="215" width="500" height="155"/>
    <rect class="card" x="1130" y="215" width="500" height="155"/>
    <rect class="card" x="1660" y="215" width="870" height="155"/>
  </g>
  <rect x="94" y="246" width="72" height="72" rx="9" fill="#5279bd"/><text class="badge" x="130" y="282">DS</text>
  <text class="node-title" x="190" y="269">Figma 设计系统</text><text class="node-en" x="190" y="309">Figma design system</text>
  <text class="small" x="190" y="341">已确认设计值 / Reviewed values</text>
  <rect x="624" y="246" width="72" height="72" rx="9" fill="#6585c6"/><text class="badge" x="660" y="282">PX</text>
  <text class="node-title" x="720" y="269">Pixso 组件节点</text><text class="node-en" x="720" y="309">Pixso component nodes</text>
  <text class="small" x="720" y="341">原生 ID 与变量 / Native IDs and variables</text>
  <rect x="1154" y="246" width="72" height="72" rx="9" fill="#406ba6"/><text class="badge" x="1190" y="282">Qt</text>
  <text class="node-title" x="1250" y="269">Qt 5.15.2 原生能力</text><text class="node-en" x="1250" y="309">Native Qt capabilities</text>
  <text class="small" x="1250" y="341">控件、属性与 API / Widgets and APIs</text>
  <rect x="1684" y="246" width="72" height="72" rx="9" fill="#6585c6"/><text class="badge" x="1720" y="282">PX</text>
  <text class="node-title" x="1780" y="269">Pixso 页面 · HTML + DSL</text><text class="node-en" x="1780" y="309">Version-matched page input</text>
  <text class="small" x="1780" y="341">布局测量 + 组件身份 / Layout + identity</text>

  <!-- White system enclosures mirror the supplied architecture reference. -->
  <rect class="panel" x="70" y="490" width="1550" height="880"/>
  <path d="M72 498 H1618 V602 H72 Z" class="panel-top"/>
  <text class="section" x="112" y="546">01  DesignToCode_GenerateComponent</text>
  <text class="section-en" x="113" y="581">组件生成 / Component generation  ·  唯一 SDK 发布方 / Sole SDK publisher</text>

  <rect class="panel" x="1680" y="490" width="850" height="380"/>
  <path d="M1682 498 H2528 V602 H1682 Z" class="panel-top"/>
  <text class="section" x="1722" y="546">02  ComponentLab</text>
  <text class="section-en" x="1723" y="581">组件展示与验收 / Component gallery and acceptance</text>

  <rect class="panel" x="1680" y="930" width="850" height="500"/>
  <path d="M1682 938 H2528 V1038 H1682 Z" class="panel-top"/>
  <text class="section" x="1722" y="986">03  DesignToCode_GenerateLayout</text>
  <text class="section-en" x="1723" y="1020">页面结构生成 / Page layout generation  ·  HTML + DSL</text>

