  <path class="edge" d="M2290 1195 V1255"/>
  <path class="edge" d="M1900 1365 V1480 H1480 V1540"/>
  <path class="edge-soft" d="M1900 821 H1668 V1450 H575 V760 H605"/>

  <!-- GenerateComponent detail cards. -->
  <rect class="card-dashed" x="115" y="635" width="430" height="150"/>
  <rect x="137" y="658" width="57" height="57" rx="8" fill="#5f83bf"/><text class="badge" x="165" y="686">01</text>
  <text class="node-title" x="211" y="681">设计证据</text><text class="node-en" x="211" y="712">Design evidence</text>
  <text class="path" x="139" y="751">Source/DesignEvidence</text>
  <text class="small" x="139" y="776">Raw → Canonical 合同</text>

  <rect class="card-dashed" x="605" y="635" width="440" height="150"/>
  <rect x="627" y="658" width="57" height="57" rx="8" fill="#5f83bf"/><text class="badge" x="655" y="686">02</text>
  <text class="node-title" x="701" y="681">设计 ↔ Qt 映射</text><text class="node-en" x="701" y="712">Design-to-Qt mapping</text>
  <text class="path" x="629" y="751">Source/Qt/MappingWorkbench</text>
  <text class="small" x="629" y="776">身份 / 属性 / API  ·  Identity / API</text>

  <rect class="card-dashed" x="115" y="835" width="430" height="150"/>
  <rect x="137" y="858" width="57" height="57" rx="8" fill="#5f83bf"/><text class="badge" x="165" y="886">03</text>
  <text class="node-title" x="211" y="881">Token 编译</text><text class="node-en" x="211" y="912">Token compilation</text>
  <text class="path" x="139" y="951">ComponentKit/design-assets</text>
  <text class="small" x="139" y="976">sToken → Profile / QSS</text>

  <rect class="card-dashed" x="605" y="835" width="440" height="150"/>
  <rect x="627" y="858" width="57" height="57" rx="8" fill="#5f83bf"/><text class="badge" x="655" y="886">04</text>
  <text class="node-title" x="701" y="881">组件定义</text><text class="node-en" x="701" y="912">Wrapper definitions</text>
  <text class="path" x="629" y="951">ComponentKit/component-definitions</text>
  <text class="small" x="629" y="976">Qt → Z_* 薄包装 / Thin wrappers</text>

  <rect class="card" x="605" y="1085" width="440" height="180"/>
  <rect x="627" y="1110" width="57" height="57" rx="8" fill="#416fae"/><text class="badge" x="655" y="1138">05</text>
  <text class="node-title" x="701" y="1134">Z_* 组件与工厂</text><text class="node-en" x="701" y="1165">Components and factory</text>
  <text class="path" x="629" y="1206">ComponentKit/runtime</text>
  <text class="small" x="629" y="1238">.h + .cpp + QSS + Theme</text>

  <rect class="card" x="1120" y="1085" width="445" height="180" stroke="#4f78b8" stroke-width="3"/>
  <rect x="1142" y="1110" width="75" height="57" rx="8" fill="#315b98"/><text class="badge" x="1180" y="1138" font-size="19">SDK</text>
  <text class="node-title" x="1232" y="1134">发布组件 SDK</text><text class="node-en" x="1232" y="1165">Published component SDK</text>
  <text class="path" x="1143" y="1206">build/sdk</text>
  <text class="small" x="1143" y="1238">include · lib · resources · manifest</text>

  <!-- ComponentLab reads an imported package; it never generates component source. -->
  <rect class="card-dashed" x="1735" y="620" width="325" height="130"/>
  <rect x="1753" y="644" width="52" height="52" rx="8" fill="#5f83bf"/><text class="badge" x="1779" y="670">IN</text>
  <text class="node-title" x="1820" y="667">SDK 校验</text><text class="node-en" x="1820" y="696">Verified reference</text>
  <text class="path" x="1754" y="731">manifest + SHA-256</text>
  <rect class="card-dashed" x="2110" y="620" width="365" height="130"/>
  <rect x="2128" y="644" width="52" height="52" rx="8" fill="#5f83bf"/><text class="badge" x="2154" y="670">UI</text>
  <text class="node-title" x="2195" y="667">组件演示</text><text class="node-en" x="2195" y="696">Component gallery</text>
  <text class="path" x="2129" y="731">Source/delivery/demo</text>
  <rect class="card" x="1900" y="785" width="400" height="70"/>
  <text class="node-title" x="1924" y="817">离线演示</text>
  <text class="path" x="1924" y="842">Offline demo · build/demo</text>

  <!-- GenerateLayout only assembles published components into a page. -->
  <rect class="card-dashed" x="1735" y="1065" width="325" height="130"/>
  <rect x="1753" y="1089" width="52" height="52" rx="8" fill="#5f83bf"/><text class="badge" x="1779" y="1115">IN</text>
  <text class="node-title" x="1820" y="1112">SDK 校验</text><text class="node-en" x="1820" y="1141">Verified reference</text>
  <text class="path" x="1754" y="1176">manifest + SHA-256</text>
  <rect class="card-dashed" x="2110" y="1065" width="365" height="130"/>
  <rect x="2128" y="1089" width="52" height="52" rx="8" fill="#5f83bf"/><text class="badge" x="2154" y="1115">H</text>
  <text class="node-title" x="2195" y="1112">HTML + DSL</text><text class="node-en" x="2195" y="1141">Layout + identity</text>
  <text class="path" x="2129" y="1176">Source/HtmlDsl</text>
  <rect class="card" x="1735" y="1255" width="330" height="110"/>
  <rect x="1753" y="1276" width="52" height="52" rx="8" fill="#416fae"/><text class="badge" x="1779" y="1302">UI</text>
  <text class="node-title" x="1820" y="1300">正式页面</text><text class="node-en" x="1820" y="1328">Formal page package</text>
  <text class="path" x="1754" y="1351">.ui · .h · .cpp · .qss</text>
  <rect class="card" x="2110" y="1255" width="365" height="110"/>
  <rect x="2128" y="1276" width="52" height="52" rx="8" fill="#416fae"/><text class="badge" x="2154" y="1302">EX</text>
  <text class="node-title" x="2195" y="1300">页面演示</text><text class="node-en" x="2195" y="1328">Page examples</text>
  <text class="path" x="2129" y="1351">build/demo/page_examples</text>

  <!-- Feedback and handoff labels sit outside the system boxes. -->
  <rect x="834" y="1408" width="430" height="52" rx="6" fill="#eaf1fc"/>
  <text class="edge-label" x="857" y="1441">状态反馈 / State review feedback</text>
  <rect x="1005" y="1467" width="205" height="38" rx="5" fill="#eaf1fc"/>
  <text class="edge-label" x="1021" y="1493">公开 SDK / Public SDK</text>
  <rect x="1681" y="1464" width="221" height="38" rx="5" fill="#eaf1fc"/>
  <text class="edge-label" x="1698" y="1490">页面交付 / Page files</text>

  <rect class="panel" x="860" y="1540" width="880" height="130"/>
  <rect x="887" y="1572" width="70" height="70" rx="9" fill="#315b98"/><text class="badge" x="922" y="1607">C++</text>
  <text class="section" x="984" y="1592">业务 Qt 工程 / Business Qt application</text>
  <text class="section-en" x="985" y="1630">uic 编译页面 · 链接 SDK · 接入业务逻辑 / Build, link, integrate</text>
  <text class="small" x="69" y="1710" fill="#aebfda">设计源与版本需分别核对 / Validate each design source and version independently</text>
</svg>
