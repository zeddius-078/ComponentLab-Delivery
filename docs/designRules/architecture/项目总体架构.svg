  <path class="edge" d="M1045 710 H1090 V1140 H1120"/>
  <path class="edge" d="M545 930 H580 V1175 H605"/>
  <path class="edge" d="M825 985 V1085"/>
  <path class="edge" d="M1045 1180 H1120"/>

  <!-- Published SDK has two independent consumers and one business consumer. -->
  <path class="edge" d="M1565 1125 H1645 V685 H1735"/>
  <path class="edge" d="M1565 1220 H1660 V1130 H1735"/>
  <path class="edge" d="M1340 1265 V1500 H1215 V1540"/>
  <path class="edge" d="M2060 685 H2110"/>
  <path class="edge" d="M2290 750 V783 H2100 V785"/>
  <path class="edge" d="M2060 1130 H2110"/>
